id: liveportrait
name: LivePortrait
repo_url: https://github.com/KlingAIResearch/LivePortrait
env:
  python: "3.10 in official README examples"
  hardware: "CUDA/PyTorch for Linux/Windows; Apple Silicon supported with slower MPS fallback"
install:
  commands:
    - "echo '[dry-run] prepare conda Python 3.10, PyTorch, FFmpeg, and optional X-Pose build for Animals mode'"
weights:
  status: AVAILABLE_PUBLIC
  source: "Hugging Face KlingTeam/LivePortrait plus Google Drive/Baidu Yun alternatives."
  commands:
    - "echo '[dry-run] verify LivePortrait pretrained weight sources and InsightFace model restrictions before download'"
smoke:
  commands:
    - "echo '[dry-run] plan python inference.py smoke test with source portrait and driving video placeholders'"
benchmark_inputs:
  commands:
    - "echo '[dry-run] map standard driving_video and source image/video benchmark inputs for LivePortrait'"
expected_outputs:
  - outputs/liveportrait/smoke.mp4
notes: "Official README provides inference code and public weights; training code availability remains CHECK_REQUIRED. License includes InsightFace non-commercial model caution."
